name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PATCHPILOT_MODE: recorded   # CI never touches the network for advisories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      # Step 8 adds: python evals/run_evals.py  →  gate on decision flips / baseline / cost
